[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devoir4-flask-calcul-api"
version = "1.0.0"
description = "API de calcul Flask - Devoir 4 CI/CD"
requires-python = ">=3.9"
dependencies = [
    "flask==3.0.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
